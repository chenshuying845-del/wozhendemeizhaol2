  <div id="musicList" class="music-list"><div class="music-list-heading">播放清單 · 1 首歌曲</div><div class="music-track"><img src="assets/non-ideal-lover-cover.jpg" alt="封面"><div><b>非理想愛人</b><small>Pandora 樂隊 · 本機音源</small></div><span style="margin-left:auto;color:#aaa">♫</span></div></div>
  <div id="musicError" class="music-error"></div>
  <audio id="musicAudio" preload="metadata" src="assets/non-ideal-lover.mp3" onloadedmetadata="musicMetadataLoaded()" ontimeupdate="musicTimeUpdate()" onended="musicEnded()" onerror="musicLoadError()"></audio>
 </div>`;
 const a=document.getElementById('musicAudio');
 if(a){a.load();}
}
function fmtMusicTime(seconds){if(!Number.isFinite(seconds)||seconds<0)return '00:00';const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function musicMetadataLoaded(){const a=document.getElementById('musicAudio');if(!a)return;const d=document.getElementById('musicDuration');if(d)d.textContent=fmtMusicTime(a.duration);const e=document.getElementById('musicError');if(e)e.textContent=''}
function musicTimeUpdate(){const a=document.getElementById('musicAudio');if(!a)return;const t=document.getElementById('musicCurrentTime'),r=document.getElementById('musicSeek');if(t)t.textContent=fmtMusicTime(a.currentTime);if(r&&a.duration)r.value=(a.currentTime/a.duration)*100}
function toggleMusicPlayback(){const a=document.getElementById('musicAudio');if(!a)return;if(a.paused){a.play().then(()=>{const b=document.getElementById('musicPlayBtn');if(b)b.textContent='Ⅱ';const v=document.getElementById('musicVinyl');if(v)v.classList.add('playing')}).catch(()=>{const e=document.getElementById('musicError');if(e)e.textContent='無法播放，請確認音訊檔案完整。'})}else{a.pause();const b=document.getElementById('musicPlayBtn');if(b)b.textContent='▶';const v=document.getElementById('musicVinyl');if(v)v.classList.remove('playing')}}
function seekMusic(value){const a=document.getElementById('musicAudio');if(a&&a.duration)a.currentTime=(Number(value)/100)*a.duration}
function restartMusic(){const a=document.getElementById('musicAudio');if(!a)return;a.currentTime=0;a.play().then(()=>{const b=document.getElementById('musicPlayBtn');if(b)b.textContent='Ⅱ';const v=document.getElementById('musicVinyl');if(v)v.classList.add('playing')}).catch(()=>{})}
function musicEnded(){const b=document.getElementById('musicPlayBtn');if(b)b.textContent='▶';const v=document.getElementById('musicVinyl');if(v)v.classList.remove('playing')}
function musicLoadError(){const e=document.getElementById('musicError');if(e)e.textContent='音訊載入失敗，請確認 assets/non-ideal-lover.mp3 存在。'}
function toggleMusicList(){const l=document.getElementById('musicList');if(l)l.classList.toggle('open')}

 else if(currentApp==='x')renderX(c);
 else if(currentApp==='settings')renderSettings(c);

function renderLine(c,f){
 if(chatIndex<0){
  c.innerHTML='<div class="muted" style="margin-bottom:8px">聊天　好友　動態 · '+contacts.length+' 位聯繫人</div>'+
  contacts.map((p,i)=>`<div class="row" onclick="openChat(${i})"><div class="avatar">${esc(p.emoji)}</div><div class="rowtext"><b>${esc(p.name)}</b><p>${esc(p.preview)}</p></div><span class="muted">›</span></div>`).join('')+
  `<div style="padding:18px 0" class="muted">💌 聊天中的線索會慢慢拼成一個故事。</div><button class="smallbtn" onclick="randomMessage()">模擬收到一條新消息</button>`;
 }else{
  let p=contacts[chatIndex];
  c.innerHTML=`<div class="center muted">與 ${esc(p.name)} 的對話 · 虛構劇情</div><div id="chatlog">${p.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${esc(m.text)}</div>`).join('')}</div>`;
  if(!p.replied){
   f.innerHTML='<div class="replybox"><div class="muted">選擇你的回復：</div>'+p.replies.map((r,i)=>`<button class="replybtn" onclick="reply(${i})">${esc(r)}</button>`).join('')+'</div>';
  }else{
   f.innerHTML='<div class="replybox"><button class="replybtn" onclick="backToChats()">‹ 返回聊天列表</button></div>';
  }
 }
}
function openChat(i){chatIndex=i;render()}
function backToChats(){chatIndex=-1;render()}
function reply(i){
 const p=contacts[chatIndex];if(p.replied)return;
 p.messages.push({from:'me',text:p.replies[i]});
 p.messages.push({from:'them',text:p.next});
 p.preview=p.next;p.replied=true;clueCount++;
 save();render();$('storyStatus').textContent='已發現 '+clueCount+' 條故事線索';
 toast('發現新線索！🔎');
}
function randomMessage(){
 const p=contacts[Math.floor(Math.random()*contacts.length)];
 p.messages.push({from:'them',text:['你在嗎？我剛想到一件事。','看到你的動態了，晚點聊聊？','有空的話，看看之前那張照片。'][Math.floor(Math.random()*3)]});

 toast(p.name+' 發來了一條新消息');
}

 <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:42px"><span>11:56</span><span>● 5G ▰</span></div>
 <div style="text-align:center;font-size:49px;letter-spacing:-3px;font-weight:500;margin-bottom:40px"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></div>
 <div onclick="showGoogleHistory()" style="display:flex;align-items:center;gap:10px;border-radius:32px;background:#dce5f8;padding:17px 15px;color:#59616c;cursor:pointer"><span style="font-size:22px">＋</span><span style="flex:1">在 Google 中搜索或输入网址</span><span>🎙</span><span>⌕</span></div>
 <div style="display:flex;gap:9px;margin:12px 0 24px"><div style="flex:1;text-align:center;background:#dce5f8;border-radius:24px;padding:12px;font-size:13px">✧ AI 模式</div><div style="flex:1;text-align:center;background:#dce5f8;border-radius:24px;padding:12px;font-size:13px">♧ 无痕模式</div></div>
 <div style="background:white;border-radius:22px;padding:18px 14px;margin-bottom:16px"><div style="display:flex;justify-content:space-around;text-align:center"><div><div style="font-size:25px">🟨</div><small>东港镇海宫</small></div><div><div style="font-size:25px">📸</div><small>Instagram</small></div><div><div style="font-size:25px">💗</div><small>最爱</small></div><div><div style="font-size:25px">𝕏</div><small>X</small></div></div></div>
 <div style="background:white;border-radius:22px;padding:17px"><b>快捷方式</b><div style="display:flex;justify-content:space-around;text-align:center;margin-top:20px;color:#4285f4"><div>☆<small style="display:block;color:#555;margin-top:8px">书签</small></div><div>▤<small style="display:block;color:#555;margin-top:8px">阅读清单</small></div><div>▣<small style="display:block;color:#555;margin-top:8px">最近打开</small></div><div>◷<small style="display:block;color:#555;margin-top:8px">历史记录</small></div></div></div>
 <div id="googleHistory" style="display:none;background:white;border-radius:20px;padding:16px;margin-top:14px"><input id="googleSearchInput" placeholder="搜索或输入网址" style="width:100%;padding:12px;border:0;border-radius:12px;background:#f1f3f4;font-size:14px;outline:none"><div style="font-size:12px;color:#777;margin:15px 0 6px">最近搜索</div>${history.map(h=>`<div onclick="document.getElementById('googleSearchInput').value='${h}';toast('已选择搜索内容')" style="padding:12px 2px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px">◷　${h}</div>`).join('')}</div></div>`;
}
function showGoogleHistory(){const h=document.getElementById('googleHistory');if(h){h.style.display='block';setTimeout(()=>document.getElementById('googleSearchInput')?.focus(),30)}}

function renderNotes(c){
 c.innerHTML=`<div class="post" style="padding:15px"><h3 style="font-size:15px">☁️ 給自己的小紙條</h3><textarea id="note" class="compose" style="min-height:230px" placeholder="寫下你的想法……"></textarea><button class="primary" style="margin-top:12px" onclick="localStorage.setItem('myPhoneNote',$('note').value);toast('備忘錄已保存')">保存</button></div>`;
 $('note').value=localStorage.getItem('myPhoneNote')||'六月二十七日。\\n還有一些事情沒有答案……';
}

function renderPhone(c,f){
 const tabs=[['favorites','☆','個人收藏'],['recent','◷','最近通話'],['contacts','♙','聯絡人'],['keypad','▦','撥號鍵盤'],['voicemail','▣','語音留言']];
 let body='';
 if(phoneTab==='favorites') body=`<h3 style="font-size:20px;margin:4px 0 14px">個人收藏</h3><div class="muted">常用聯絡人</div>${['樊振東','張本智和','媽媽','哥哥'].map(n=>phonePersonRow(n)).join('')}`;
 if(phoneTab==='recent') body=`<h3 style="font-size:20px;margin:4px 0 14px">最近通話</h3><div class="muted" style="padding:24px 5px;text-align:center">尚無最近通話</div>`;
 if(phoneTab==='contacts') body=phoneContactIndex>=0?phoneContactDetail(phonePeople[phoneContactIndex]):`<h3 style="font-size:20px;margin:4px 0 12px">聯絡人</h3><input placeholder="搜尋聯絡人" oninput="filterPhoneContacts(this.value)" style="width:100%;padding:10px;border:0;border-radius:10px;background:#e9ecef;margin-bottom:8px"><div id="phoneContactList">${phonePeople.map(n=>phonePersonRow(n)).join('')}</div>`;
 if(phoneTab==='keypad') body=`<h3 style="font-size:20px;margin:4px 0 14px">撥號鍵盤</h3><input id="dialNumber" placeholder="輸入號碼" readonly style="width:100%;padding:14px;border:0;background:transparent;text-align:center;font-size:23px;margin-bottom:12px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button class="key" style="width:55px;height:55px;background:white;border:0" onclick="dialKey('${n}')">${n}</button>`).join('')}</div><button class="primary" style="margin-top:15px;background:#2fb878;color:white" onclick="toast('模擬撥號，不會撥出真實電話')">☎</button>`;
 if(phoneTab==='voicemail') body=`<h3 style="font-size:20px;margin:4px 0 14px">語音留言</h3><div class="voicemail-card"><div style="display:flex;align-items:center;gap:10px"><button class="vm-play" onclick="toggleVoicemail()">${vmPlaying?'Ⅱ':'▶'}</button><div style="flex:1"><b>張本智和</b><div class="muted">2025年7月13日 22:00</div></div><span class="muted">00:25</span></div><div class="vm-wave">${Array.from({length:38},(_,i)=>`<i style="--h:${5+(i*7%17)}px"></i>`).join('')}</div><div class="muted">${vmPlaying?'正在播放語音留言（模擬）':'點擊播放可模擬收聽'}</div><button class="smallbtn" onclick="vmOpen=!vmOpen;renderPhone($('appContent'),$('appFooter'))">${vmOpen?'收起文字':'轉成文字'}</button>${vmOpen?`<div style="font-size:13px;line-height:1.8;padding:12px 0;border-top:1px solid #eee;margin-top:10px">你真的不打算來找我嗎？</div>`:''}</div>`;
 c.innerHTML=`<div style="padding-bottom:8px">${body}</div>`;
 f.innerHTML=`<div class="phone-tabs">${tabs.map(([id,ico,label])=>`<button class="phone-tab ${phoneTab===id?'active':''}" onclick="setPhoneTab('${id}')"><span>${ico}</span>${label}</button>`).join('')}</div>`;
}
function phonePersonRow(name){return `<div class="row" onclick="openPhoneContact('${name}')"><div class="avatar" style="background:#e5f2ec;color:#26845e">${name==='媽媽'?'♡':name==='爸爸'?'⌂':name==='哥哥'?'☾':'●'}</div><div class="rowtext"><b>${esc(name)}</b><p>聯絡人 · 電話資訊已隱去</p></div><span class="muted">›</span></div>`}
function setPhoneTab(tab){phoneTab=tab;phoneContactIndex=-1;renderPhone($('appContent'),$('appFooter'))}
function openPhoneContact(name){phoneTab='contacts';phoneContactIndex=phonePeople.indexOf(name);renderPhone($('appContent'),$('appFooter'))}
function phoneContactDetail(name){return `<button class="back" onclick="phoneContactIndex=-1;renderPhone($('appContent'),$('appFooter'))">‹ 返回聯絡人</button><div class="contact-detail"><div class="big-avatar">${name==='媽媽'?'♡':name==='爸爸'?'⌂':name==='哥哥'?'☾':'●'}</div><h2>${esc(name)}</h2><div class="muted">電話資訊已隱去</div><button class="contact-action" onclick="toast('模擬通話，不會撥打真實電話')">☎ 通話</button><button class="contact-action" onclick="toast('模擬訊息')">訊息</button></div>`}
function filterPhoneContacts(q){const list=$('phoneContactList');if(list)list.innerHTML=phonePeople.filter(n=>n.includes(q)).map(n=>phonePersonRow(n)).join('')||'<div class="muted" style="padding:20px">找不到聯絡人</div>'}
function dialKey(k){const n=$('dialNumber');if(n)n.value+=k}
function toggleVoicemail(){vmPlaying=!vmPlaying;renderPhone($('appContent'),$('appFooter'));if(vmPlaying)setTimeout(()=>{vmPlaying=false;if(currentApp==='phone'&&phoneTab==='voicemail')renderPhone($('appContent'),$('appFooter'))},25000)}

function renderPhotos(c){
 c.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:18px;margin:2px 0">所有照片</h3><span class="muted">${albumPhotos.length} 張</span></div><div class="muted" style="margin-top:5px">依日期排序 · 僅顯示已加入的照片</div><div class="album-grid">${albumPhotos.map((p,i)=>`<button class="album-item" onclick="openPhoto(${i})"><img src="${p.src}" alt="相片 ${i+1}" loading="lazy"><span class="album-date">${p.date}</span></button>`).join('')}</div><div id="photoViewer" class="photo-viewer" onclick="closePhoto(event)"><button onclick="closePhoto(event)" aria-label="關閉">×</button><img id="photoViewerImage" src="" alt="放大相片"></div>`;
}
function openPhoto(i){const v=$('photoViewer'),im=$('photoViewerImage');if(v&&im){im.src=albumPhotos[i].src;v.classList.add('open')}}
function closePhoto(e){if(e.target.id==='photoViewer'||e.target.tagName==='BUTTON')$('photoViewer').classList.remove('open')}

</script>
</body></html>
